# Diablo II area rules. One table per area, keyed by the exact name D2R shows
# in the top-right corner of the screen.
#
#   act            1-5
#   next           the area you progress to (empty string for dead ends)
#   has_waypoint   whether this area has one
#   to_waypoint    hint from the *entrance* to the waypoint
#   to_next        hint from the *waypoint* (or entrance if no waypoint) to the exit
#   confidence     high | medium | low  -- how much to trust the two hints
#
# dir values and what they mean on screen:
#   cw / ccw     circle the map clockwise / counter-clockwise from where you entered
#   opposite     far side of the map from the entrance
#   up/down/left/right   compass-ish on the isometric map (up = north-east on the automap)
#   outer-wall   hug the outer edge of the map
#   linear       corridor level, just keep going
#   dead-end     the thing you want is at a dead end
#   none         no reliable rule, explore
#
# These are *tendencies* of D2's map generator collected from community
# guides, not guarantees. Fix entries as you play: Ctrl+F12 logs the current
# area as wrong so they can be revisited in a batch.

