# Diablo II map-reading rules. One table per area, keyed by the exact name D2R
# shows in the top-right corner of the screen.
#
#   act            1-5
#   next           the area you progress to ("" for dead ends)
#   has_waypoint   whether this area has one
#   to_waypoint    hint from the ENTRANCE to the waypoint
#   to_next        hint from the WAYPOINT (or entrance if no waypoint) to the exit
#   confidence     high = both sources agree, medium = one source, low = inferred
#   source         where the rule comes from (see below)
#   levels         alvl on [Normal, Nightmare, Hell]; [0,0,0] for towns
#   quests         quest objectives located in this area (may be empty)
#   uniques        superunique monsters that spawn here
#   notes          other zone-specific facts worth a line
#   farm           farm-run routes through this area (Countess, Pit, ...):
#                  how to reach the target fast, not the story path
#   ocr_name       optional: the on-screen name when it differs from the key
#                  (Act 2 and Act 3 both have "Sewers Level 1/2"; the overlay
#                  picks by the act you were last in)
#
# dir values. Left/straight/right/back are from YOUR CHARACTER'S FACING as you
# arrive through the entrance (the speedrunners' convention) -- never compass
# directions. Where a source gives a compass direction and the entrance side
# is fixed (e.g. you always enter Spider Forest from the bottom) it has been
# converted; otherwise the tip spells it out in screen terms (top-right etc).
#   left straight right back   character-relative, from the entrance (or WP)
#   corner  edge  opposite     outdoor shape rules ("some other corner", etc.)
#   near    inside  path       right next to you / somewhere inside / follow the path
#   fixed                      static layout, memorise it
#   random                     NO ACCEPTED RULE -- the sources say so explicitly
#   none                       not applicable (e.g. no waypoint here)
#
# Sources:
#   levels     https://www.purediablo.com/diablo-2/diablo-2-area-levels
#   maxroll    https://maxroll.gg/d2/resources/map-reading
#   cheatsheet https://github.com/minimapletinytools/d2r-speedrun-cheatsheet
#              (speedrun community, derived from Teo-'s guide on speedrun.com)
#
# Ctrl+F12 in game logs the current area to debug/flagged.log when a rule is
# wrong in practice.

