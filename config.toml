# diablo2-overlay configuration. Edited by the settings window; comments are
# regenerated on every save.

[capture]
backend = "xwayland"          # only backend so far; D2R under Proton is an X client
display = ":1"          # Xwayland display (check: echo $DISPLAY)
interval = 1.0        # seconds between reads

# Where the area name is, as fractions of the game window (the clock / area /
# difficulty block in the top-right corner).
[capture.region]
x = 0.72
y = 0.0197
w = 0.0784
h = 0.0896

[overlay]
output = "DP-3"            # monitor the game is on, by connector; "" = compositor default
anchor = "top-left"            # top-left | top-right | bottom-left | bottom-right
margin_x = 16        # logical (scaled) pixels from the side edge
margin_y = 45        # logical pixels from the top/bottom edge
font_size = 29
width = 30              # minimum characters per line; long tips wrap
hotkeys = true          # read /dev/input for Ctrl+F9..F12 while D2R runs

[overlay.sections]
waypoint = true
next = true
farm = true
quests = true
exp = true
drops = true
notes = true
uniques = true
