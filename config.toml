# diablo2-overlay configuration. Edited by the settings window; comments are
# regenerated on every save.

[capture]
backend = "xwayland"          # only backend so far; D2R under Proton is an X client
display = ":1"          # Xwayland display (check: echo $DISPLAY)
interval = 1.0        # seconds between reads

# Where the area name is, as fractions of the game window (the clock / area /
# difficulty block in the top-right corner).
[capture.region]
x = 0.7208
y = 0.0235
w = 0.0765
h = 0.1261

[overlay]
output = "DP-3"            # monitor the game is on, by connector; "" = compositor default
anchor = "top-left"            # top-left | top-right | bottom-left | bottom-right
margin_x = 16        # logical (scaled) pixels from the side edge
margin_y = 45        # logical pixels from the top/bottom edge
font_size = 24
font = "Hack"                # monospace family; falls back to any monospace
opacity = 0.82          # background scrim alpha, 0.2-1.0
padding = 12          # px inside the box
width = 30              # minimum characters per line; long tips wrap
hotkeys = true          # read /dev/input for Ctrl+F9..F12 while D2R runs
follow_focus = true  # show the overlay only while the game window is focused
hide_unread = true   # hide it while the area name cannot be read (map off, menus)
compact = false          # one terse line per section (Ctrl+Shift+F9)
profile = "custom"          # all | custom | a name from [overlay.profiles] (Ctrl+Shift+F10)

[overlay.sections]           # the "custom" profile
waypoint = true
next = true
farm = true
quests = false
exp = true
drops = true
immune = true
notes = true
uniques = true

# Named section sets, cycled with Ctrl+Shift+F10. "all" and "custom" (the
# block above) always exist; add, edit or delete entries freely.
[overlay.profiles]
"farming" = ["farm", "drops", "uniques", "exp"]
"speedrun" = ["waypoint", "next", "quests"]

# Rune helper: a second box listing the 33 runes by number (1 El ... 33 Zod).
# Same monitor, font and style as the main overlay; its own corner.
[overlay.runes]
enabled = true
anchor = "bottom-left"      # top-left | top-right | bottom-left | bottom-right
margin_x = 12
margin_y = 12
columns = 3    # 1-6
values = true      # show each rune's trade value in HR (traderie.com snapshot)
sort = "number"          # number | value (most valuable first)

# Gem helper: a third box with the seven gems. Perfect gems are priced from
# traderie.com; with grades on, every grade is listed at a third per step
# (the cube's 3:1 upgrade), since lower grades are not traded on their own.
[overlay.gems]
enabled = true
anchor = "bottom-right"       # top-left | top-right | bottom-left | bottom-right
margin_x = 12
margin_y = 12
columns = 2     # 1-7 (Perfect-only list)
values = true       # show trade values in HR
sort = "name"           # name | value (most valuable first)
grades = false       # one row per gem, one column per grade Chipped..Perfect

[debug]
save_lowconf = true  # save crops that matched poorly to debug/lowconf/ (for fixing OCR)
lowconf_keep = 200  # keep the newest N of them
