# diablo2-overlay configuration.

[capture]
backend = "xwayland"          # only backend so far; D2R under Proton is an X client
display = ":1"                # Xwayland display (check: echo $DISPLAY)
interval = 1.0                # seconds between reads

# Where the area name is, as fractions of the game window. D2R draws the
# clock / area / difficulty block in the top-right corner. Tune with
# tools/calibrate.py, which saves the crop it sees to debug/.
[capture.region]
x = 0.84
y = 0.02
w = 0.155
h = 0.09

[overlay]
output = "DP-1"                # monitor the game is on, by connector (overlay.py --list-outputs)
anchor = "top-right"          # top-left | top-right | bottom-left | bottom-right
# Margins are in logical (scaled) pixels. The game's clock/area/difficulty
# block ends ~200 physical px down at 1.7x scale, i.e. ~118 logical.
margin_x = 12
margin_y = 122
font_size = 15
width = 60                    # minimum characters per line; tips in areas.toml are written to fit
